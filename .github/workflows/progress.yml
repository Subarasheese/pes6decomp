name: progress

# Progress sites (ByteMatch, decomp.dev) read the objdiff progress report from successful push
# runs on the default branch, as an artifact named VERSION_report. The report cannot be built in
# CI (that needs the game): tools/publish_progress.py makes it locally from a verified full build
# and commits it as progress/report.json; this workflow uploads that file.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: progress
      - uses: actions/upload-artifact@v4
        with:
          name: SLES_542.03_report
          path: progress/report.json
          if-no-files-found: error
