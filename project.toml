# Everything the tools need to know about this game. Another game = another project.toml
# (plus a loader in tools/loaders/ and a knowledge file); the tools themselves stay the same.
#
# The executable mixes Sony ee-gcc 2.9, ee-gcc 2.96 and Metrowerks objects.
# Each recovered source selects a non-default compiler with its first-line marker.

[game]
name = "Pro Evolution Soccer 6 (PAL, SLES-542.03)"
serial = "SLES-542.03"
basename = "pes6"
# This project keeps address-named functions flat until units are identified.
source_layout = "flat"
executable = "orig/SLES_542.03"
# The executable is already a plain ELF, so it doubles as the "converted" ELF.
elf = "orig/SLES_542.03"
# The single PT_LOAD segment holds both code and data; this is where the code ends (tools/build.py).
text_end = 0x00372AE0
# Global pointer (config/pes6.yaml gp_value); the linker needs it for GP-relative relocations.
gp = 0x003EF370
splat_config = "config/pes6.yaml"
# tools/loaders/<loader>.py must define load(path) -> (entry, [(address, bytes), ...])
loader = "elf"

[cpu]
category = "R5900"
as_flags = "-EL -march=r5900 -mabi=eabi"
objdump_arch = "mips:5900"
m2c_target = "mipsee-gcc-c"

[compiler]
name = "Sony ee-gcc 2.9-991111"
# The image is mostly the older ee-gcc 2.9 (SCE 2.9-991111): it does true sibling calls (a bare
# `j target` tail call with no stack frame), which 2.96 never emits. A minority of translation
# units are ee-gcc 2.96 (`/* compiler: ee-gcc-2.96 */` marker). Default small-data (G = 8): a
# scalar extern is addressed through $gp, an array/struct extern (larger than 8 bytes) is absolute.
dir = "toolchains/ee-gcc2.9-991111"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -fno-exceptions -Iinclude"
extension = "c"

# The Metrowerks CodeWarrior PS2 compilers the .comment names; a source may ask for one with a
# first-line marker `/* compiler: NAME */` (tools/project.py source_compiler). They run through
# wibo (a Windows PE loader).
[compilers."mwcc-3.0.3"]
name = "Metrowerks CodeWarrior PS2 3.0.3 (mwccps2)"
dir = "toolchains"
command = "{dir}/wibo/wibo {dir}/tc/mwcps2-3.0.3-020716/mwccps2.exe -O3 -c -Iinclude"

# Other Metrowerks PS2 versions a source may ask for with a marker on its first line,
# `/* compiler: NAME */` (tools/project.py source_compiler).
[compilers."ee-gcc-2.9"]
name = "Sony ee-gcc 2.9-991111"
dir = "toolchains/ee-gcc2.9-991111"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -fno-exceptions -Iinclude"

[compilers."ee-gcc-2.96"]
name = "Sony ee-gcc 2.96 (2.96-ee-001003-1)"
dir = "toolchains/ee-gcc2.96"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -fno-exceptions -Iinclude"

# Same compiler but with sibling-call optimization off: the original keeps a frame + `jal` + restore
# for `void f(){ g(); }` wrappers (a sibling call would be a bare `j` and no frame).
[compilers."ee-gcc-2.96-nosib"]
name = "Sony ee-gcc 2.96, -fno-optimize-sibling-calls"
dir = "toolchains/ee-gcc2.96"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -fno-optimize-sibling-calls -fno-exceptions -Iinclude"

[compilers."mwcc-2.3.3"]
dir = "toolchains"
command = "{dir}/wibo/wibo {dir}/tc/mwcps2-2.3.3-000906/mwccps2.exe -O3 -c -Iinclude"

[compilers."mwcc-2.4"]
dir = "toolchains"
command = "{dir}/wibo/wibo {dir}/tc/mwcps2-2.4-001213/mwccps2.exe -O3 -c -Iinclude"

[compilers."mwcc-3.0"]
dir = "toolchains"
command = "{dir}/wibo/wibo {dir}/tc/mwcps2-3.0-011126/mwccps2.exe -O3 -c -Iinclude"

[compilers."mwcc-3.0.1"]
dir = "toolchains"
command = "{dir}/wibo/wibo {dir}/tc/mwcps2-3.0.1-020123/mwccps2.exe -O3 -c -Iinclude"

# The bulk of the non-leaf game code (s-registers saved with `sq`). `-O4,p` (level 4, speed) is
# required: it inverts loops into a guard plus bottom test and leaves forward guard branches
# unfilled, as the retail code does. Every leaf that matched at -O3 also matches at -O4,p.
[compilers."mwcc-3.0.1b210"]
dir = "toolchains"
command = "{dir}/wibo/wibo {dir}/tc/mwcps2-3.0.1b210-060308/mwccps2.exe -O4,p -c -Iinclude"

# Same compiler at -O2. A minority of the game's leaves were built with -O2: they keep the
# returned load before `jr` instead of moving it into the delay slot and do not if-convert a
# store into a `bnel`/`beql` delay slot.
[compilers."mwcc-3.0.1b210-O2"]
dir = "toolchains"
command = "{dir}/wibo/wibo {dir}/tc/mwcps2-3.0.1b210-060308/mwccps2.exe -O2 -c -Iinclude"

# An earlier 3.0.1 build (2005-03-17, decomp.me `mwcps2-3.0.1b151-050317`). Builds up to b151 do
# not hoist a branch target's first instruction into a branch-likely delay slot when that target
# has several predecessors; b198 and later (including b210) do. The match engine's ball update
# (Pes6Ball_Update) needs this build; b145 produces the same code there.
[compilers."mwcc-3.0.1b151"]
dir = "toolchains"
command = "{dir}/wibo/wibo {dir}/tc/mwcps2-3.0.1b151-050317/mwccps2.exe -O4,p -c -Iinclude"

# Sony SDK and runtime objects were built without small data (-G0): scalars are addressed
# absolutely, not through $gp. Their sources are shared with the GT4 decompilation, which uses
# the same SDK release; these profiles reproduce GT4's flags for them.
[compilers."ee-gcc-2.9-G0"]
dir = "toolchains/ee-gcc2.9-991111"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -G0 -fno-exceptions -Iinclude"

# Sony SDK objects assembled by SCE's later assembler: ee-gcc 2.9's compiler with the ee-as 2.10
# shipped with ee-gcc 2.96, which fills branch and return delay slots that ee-as 2.9 leaves empty
# (`jr $ra` followed by the result's sign extension in ftoi). The kernel printf object also keeps
# the FP condition hazard nop (`c.eq.s; nop; bc1f`) that tools/cc_fpnop.sh restores.
[compilers."ee-gcc-2.9-as210-G0"]
dir = "toolchains/ee-gcc2.9-991111"
command = "bash {tools}/cc_fpnop.sh {dir}/bin/ee-gcc -B {dir}/../ee-gcc2.96/ee/bin/ -B {dir}/bin/ee- -O2 -G0 -fno-exceptions -Iinclude"

[compilers."ee-gcc-2.96-G0"]
dir = "toolchains/ee-gcc2.96"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -G0 -fno-exceptions -Iinclude"

[compilers."ee-gcc-2.96-nsa-G0"]
dir = "toolchains/ee-gcc2.96"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -G0 -fno-exceptions -fno-strict-aliasing -Iinclude"

[compilers."ee-gcc-2.96-nsa-nosib-G0"]
dir = "toolchains/ee-gcc2.96"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -G0 -fno-exceptions -fno-strict-aliasing -fno-optimize-sibling-calls -Iinclude"

[compilers."ee-gcc-2.96-G0-g"]
dir = "toolchains/ee-gcc2.96"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -G0 -fno-exceptions -g -Iinclude"

[compilers."ee-gcc-2.96-nsa-G0-g"]
dir = "toolchains/ee-gcc2.96"
command = "{dir}/bin/ee-gcc -c -B {dir}/bin/ee- -O2 -G0 -fno-exceptions -fno-strict-aliasing -g -Iinclude"
